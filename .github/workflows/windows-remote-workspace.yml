          $summaryLines -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: '15b · 🔬 Audit installed apps and versions (no false success)'
        if: ${{ !inputs.validation_only && steps.remote.outcome == 'success' }}
        shell: pwsh
        continue-on-error: true
        run: python -m windows.app_audit
      - name: '16 · 🎨 Publish app status and HTML dashboard'
        if: ${{ !cancelled() && !inputs.validation_only && steps.remote.outcome == 'success' }}
        shell: pwsh
        continue-on-error: true
        env:
          WFS_APPS: ${{ steps.legacy_apps.outcome }}
        run: python -m windows.legacy_dashboard apps
      - name: '17 · 📎 Attach application dashboard'
        if: ${{ !cancelled() && !inputs.validation_only && steps.remote.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        continue-on-error: true
        with:
          name: wfs-windows-apps-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wfs-legacy-apps-${{ github.run_id }}-${{ github.run_attempt }}.html
          if-no-files-found: warn
          retention-days: 7
      - name: '18 · ⏳ Keep verified remote session active'
        if: ${{ !cancelled() && !inputs.validation_only && steps.remote.outcome == 'success' }}
        shell: pwsh
        run: |
          Write-Host '::notice title=WFS Remote Ready::Use the address and login name from the Summary tab. Cancel this workflow to stop the session early.'
          python shared/workspace.py hold
      - name: '19 · 🧹 Restore system settings and clean up'
        if: ${{ always() && steps.preflight.outcome == 'success' && !inputs.validation_only }}
        shell: pwsh
        timeout-minutes: 4
        run: |
          try { ./windows/remote.ps1 -Phase cleanup } catch { Write-Warning $_.Exception.Message }
          try { ./windows/restore-msi-policy.ps1 } catch { Write-Warning $_.Exception.Message }
          # Hosted Tailscale GitHub Action performs its own post-job logout.
          # Never log out a pre-existing self-hosted Tailscale identity.
