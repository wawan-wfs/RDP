          }

          function Install-MetaTrader {
            param(
              [Parameter(Mandatory = $true)]
              [ValidateSet('mt4', 'mt5')]
              [string] $Version
            )

            $mutex = [Threading.Mutex]::new($false, 'Global\RdpWorkflowWingetInstall')
            $locked = $false
            try {
              try { $locked = $mutex.WaitOne(600000) }
              catch [Threading.AbandonedMutexException] { $locked = $true }
              if (-not $locked) { throw '❌ Timed out waiting for MetaTrader installer lock.' }
            $installerUrl = if ($Version -eq 'mt4') {
              'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt4/mt4setup.exe'
            } else {
              'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe'
            }

            $installerPath = Join-Path $env:TEMP "metatrader-$Version-setup.exe"
            Invoke-WebRequest -Uri $installerUrl -OutFile $installerPath -UseBasicParsing -TimeoutSec 120 -ErrorAction Stop

            if (-not (Test-Path $installerPath)) {
              throw "❌ MetaTrader $Version installer download did not create a file."
            }

            $signature = Get-AuthenticodeSignature -FilePath $installerPath
            if ($signature.Status -ne 'Valid') {
              throw "❌ MetaTrader $Version installer signature is not valid: $($signature.Status)."
            }

            $folderName = if ($Version -eq 'mt4') { 'MetaTrader 4' } else { 'MetaTrader 5' }
            $targetDir = Join-Path $env:ProgramFiles $folderName
            $installerExit = Invoke-BoundedInstaller -FilePath $installerPath -Arguments @('/auto',('/path:"{0}"' -f $targetDir)) -TimeoutSeconds 190
            Remove-Item -LiteralPath $installerPath -Force -ErrorAction SilentlyContinue

            if ($installerExit -ne 0) {
              throw "❌ MetaTrader $Version installer exited with code $($installerExit)."
            }

            $names = if ($Version -eq 'mt4') { @('terminal.exe') } else { @('terminal64.exe','terminal.exe') }
            $terminal = @($names | ForEach-Object { Join-Path $targetDir $_ } | Where-Object { Test-Path $_ } | Select-Object -First 1)[0]
            if (-not $terminal) { throw "MetaTrader $Version setup exited $installerExit but no trading terminal was found in $targetDir" }
            Write-Host "[WFS/APP] MetaTrader $Version verified: $terminal"
            } finally {
              if ($locked) { $mutex.ReleaseMutex() }
              $mutex.Dispose()
            }
          }

          function Install-ArtCraft {
            # Fetch the latest OFFICIAL release and SHA256SUMS instead of pinning v0.3.2.
            $api = 'https://api.github.com/repos/storytold/craft-launcher/releases/latest'
            $headers = @{ 'User-Agent' = 'WFS-RDP-Installer'; Accept = 'application/vnd.github+json' }
            $release = Invoke-RestMethod -Uri $api -Headers $headers -TimeoutSec 30 -ErrorAction Stop
            if ([string]$release.tag_name -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'ArtCraft release tag invalid' }
            $msiAsset = @($release.assets | Where-Object { $_.name -match '^artcraft-launcher-[0-9.]+-windows-x64\.msi$' } | Select-Object -First 1)[0]
            $sumAsset = @($release.assets | Where-Object { $_.name -eq 'SHA256SUMS.txt' } | Select-Object -First 1)[0]
            if (-not $msiAsset -or -not $sumAsset) { throw 'ArtCraft latest release missing MSI or SHA256SUMS.txt' }
            if (([uri]$msiAsset.browser_download_url).Host -ne 'github.com') { throw 'ArtCraft MSI must originate from GitHub' }
            $dir = Join-Path $env:ProgramData 'RDP-Setup\ArtCraft-Launcher-Installer'
            New-Item -ItemType Directory -Path $dir -Force | Out-Null
            $msiPath = Join-Path $dir $msiAsset.name
            $sumPath = Join-Path $dir 'SHA256SUMS.txt'
            try {
              Write-Host "[WFS/APP] ArtCraft latest release: $($release.tag_name)"
              Invoke-WebRequest -Uri $msiAsset.browser_download_url -OutFile $msiPath -TimeoutSec 100 -ErrorAction Stop
              Invoke-WebRequest -Uri $sumAsset.browser_download_url -OutFile $sumPath -TimeoutSec 40 -ErrorAction Stop
              $checksumLine = @(Get-Content $sumPath | Where-Object { $_ -match [regex]::Escape($msiAsset.name) } | Select-Object -First 1)[0]
              if (-not $checksumLine -or $checksumLine -notmatch '^([0-9a-fA-F]{64})\s+') { throw 'No matching release SHA256 checksum' }
              $hash = (Get-FileHash -Path $msiPath -Algorithm SHA256).Hash
              if ($hash -ne $Matches[1]) { throw 'ArtCraft latest release checksum mismatch' }
              $data = Invoke-RdpUserTask -Name ArtCraftLatest -TimeoutSeconds 300 -Context @{ Installer=$msiPath; Version=$release.tag_name.TrimStart('v') } -Script {
                $candidates = @((Join-Path $env:LOCALAPPDATA 'Programs\ArtCraft Launcher\artcraft-launcher.exe'),(Join-Path $env:ProgramFiles 'ArtCraft Launcher\artcraft-launcher.exe'))
                $exe = @($candidates | Where-Object { Test-Path $_ } | Select-Object -First 1)[0]
                $currentVersion = [version]'0.0.0.0'
                if ($exe) {
                  try { $currentVersion = [version]((Get-Item $exe).VersionInfo.FileVersion -replace '[^0-9.].*$','') }
                  catch { $currentVersion = [version]'0.0.0.0' }
                }
                if (-not $exe -or $currentVersion -lt [version]$ctx.Version) {
                  $args = @('/i',('"{0}"' -f $ctx.Installer),'/qn','/norestart','INSTALLDESKTOPSHORTCUT=0')
                  $process = Start-Process "$env:SystemRoot\System32\msiexec.exe" -ArgumentList $args -PassThru -Wait
                  if ($process.ExitCode -notin @(0,3010,1641)) { throw "ArtCraft MSI exit code $($process.ExitCode)" }
                }
                $exe = @($candidates | Where-Object { Test-Path $_ } | Select-Object -First 1)[0]
                if (-not $exe) { throw 'Latest ArtCraft Launcher executable absent after installation' }
                [pscustomobject]@{ Executable=$exe; Version=(Get-Item $exe).VersionInfo.FileVersion }
              }
              "ARTCRAFT_EXE=$($data.Executable)" | Add-Content $env:GITHUB_ENV -Encoding UTF8
              Write-Host "[WFS/APP] ArtCraft latest executable: $($data.Executable) ($($data.Version))"
            } finally {
              Remove-Item $msiPath,$sumPath -Force -ErrorAction SilentlyContinue
            }
          }

          function Install-OfficialPowerShellApp {
            param(
              [Parameter(Mandatory = $true)] [string] $Name,
              [Parameter(Mandatory = $true)] [string] $Uri,
              [ValidateSet('plain', 'hermes', 'openclaw')]
              [string] $Mode = 'plain'
            )

            $commandName = switch ($Name) {
