# WFS Remote Workspaces — rebuilt version, not the old source snapshot.
name: WFS Windows Remote Workspace
on:
  workflow_dispatch:
    inputs:
      runner_type:
        description: Use a dedicated self-hosted host for long-lived or general-purpose work
        required: true
        type: choice
        default: github
        options:
        - github
        - self-hosted
      validation_only:
        description: Run source/fixture checks only; no secrets, tailnet or remote listener
        required: true
        type: boolean
        default: false
      duration_hours:
        description: Maximum session duration, within the job timeout
        required: true
        type: choice
        default: '6'
        options:
        - '6'
        - '1'
        - '3'
      tailscale_hostname:
        description: Requested hostname for new hosted tailnet nodes
        required: true
        type: string
        default: rdp-runner
      hostname_mode:
        description: Reuse hostname or append run and attempt IDs
        required: true
        type: choice
        default: same_each_run
        options:
        - same_each_run
        - unique_each_run
      windows_version:
        description: Hosted Windows image (ARM64 + browser access automatically uses Windows 2025 x64)
        required: true
        type: choice
        default: windows-2025
        options:
        - windows-2025
        - windows-latest
        - windows-2022
        - windows-11-arm
        - windows-2025-vs2026
      novnc_transport:
        description: Novnc transport
        required: true
        type: choice
        default: tailscale_tcp
        options:
        - tailscale_tcp
        - tailscale_https
      rdp_username:
        description: Temporary desktop login name
        required: true
        type: string
        default: RDP
      remote_access:
        description: RDP native, browser desktop (noVNC), or both
        required: true
        type: choice
        default: rdp
        options:
        - rdp
        - novnc
        - both
      rdp_password_mode:
        description: Rdp password mode
        required: true
        type: choice
        default: same_from_secret
        options: &id001
        - same_from_secret
        - random_each_run
      vnc_password_mode:
        description: Vnc password mode
        required: true
        type: choice
        default: same_from_secret
        options: *id001
      install_artcraft:
        description: Attempt the verified ArtCraft Launcher release asset
        required: true
        type: boolean
        default: true
      ide_choice:
        description: Ide choice
        required: true
        type: choice
        default: none
        options:
        - none
        - antigravity
        - vscode
        - both
      editor_choice:
        description: Editor choice
        required: true
        type: choice
        default: none
        options:
        - none
        - capcut
        - shotcut
        - both
      metatrader_choice:
        description: Optional MT4 Exness / MT5 terminal (no broker login)
        required: true
        type: choice
        default: none
        options:
        - none
        - mt4
        - mt5
        - both
      router_choice:
        description: Router choice
        required: true
        type: choice
        default: none
        options:
        - none
        - 9router
        - omniroute
        - both
      coding_agent_choice:
        description: Coding agent choice
        required: true
        type: choice
        default: none
        options:
        - none
        - codex
        - claude
        - both
      ai_agent_choice:
        description: both = Hermes and OpenClaw; all also includes OpenCode
        required: true
        type: choice
        default: none
        options:
        - none
        - hermes
        - openclaw
        - opencode
        - both
        - all
permissions:
  contents: read
concurrency:
  group: ${{ inputs.hostname_mode == 'same_each_run' && format('wfs-node-{0}', inputs.tailscale_hostname) || format('wfs-run-{0}', github.run_id) }}
  cancel-in-progress: false
jobs:
  workspace:
    name: Windows workspace · ${{ inputs.validation_only && 'Validation' || inputs.remote_access }}
    # noVNC needs the x64 TightVNC service. Resolve the hosted image before scheduling.
    runs-on: ${{ inputs.runner_type == 'self-hosted' && fromJSON('["self-hosted","wfs-windows"]') || (inputs.windows_version == 'windows-11-arm' && inputs.remote_access != 'rdp' && 'windows-2025') || inputs.windows_version }}
    timeout-minutes: 360
    env:
      WFS_WINDOWS_LOG: '1'
      PYTHONUTF8: '1'
    steps:
    - name: '01 · Source checkout'
      id: checkout
      uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: '02 · Python toolchain'
      id: python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: '03 · Configure workspace'
      id: preflight
      shell: pwsh
      env:
        WFS_DEDICATED_RUNNER: ${{ vars.WFS_DEDICATED_RUNNER }}
        WFS_VALIDATE_ONLY: ${{ inputs.validation_only }}
      run: |
        if ($env:WFS_VALIDATE_ONLY -ne 'true' -and $env:RUNNER_ENVIRONMENT -eq 'self-hosted' -and $env:WFS_DEDICATED_RUNNER -ne 'true') {
          throw 'Use an isolated dedicated Windows lab runner and set WFS_DEDICATED_RUNNER=true'
        }
        python shared/workspace.py init windows
    - name: '04 · Native checks (validation only)'
      id: verify
      if: ${{ inputs.validation_only }}
      timeout-minutes: 8
      shell: pwsh
      run: |
        $PSNativeCommandUseErrorActionPreference = $true
        python -m pip install --disable-pip-version-check -r tests/requirements.txt
        python tests/test_workspaces.py
        python windows/test_novnc.py
        ./tests/verify-windows.ps1
    - name: '05 · Join private tailnet (hosted runner)'
      id: tailnet
      if: ${{ !inputs.validation_only && inputs.runner_type == 'github' }}
      uses: tailscale/github-action@v4
      timeout-minutes: 5
      with:
        authkey: ${{ secrets.TAILSCALE_AUTH_KEY || secrets.TAILSCALE_AUTHKEY }}
        hostname: ${{ env.WFS_HOSTNAME }}
        args: --accept-dns=false --unattended
        timeout: 45s
        retry: '2'
    - name: '06 · Start and verify RDP / noVNC'
      id: remote
      shell: pwsh
      timeout-minutes: 22
      env:
        RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
      run: ./windows/remote.ps1 -Phase start
      if: ${{ !inputs.validation_only }}
    - name: '07 · Publish connection card and setup timeline'
      if: ${{ !cancelled() }}
      shell: pwsh
      continue-on-error: true
      env:
        WFS_CHECKOUT: ${{ steps.checkout.outcome }}
        WFS_PYTHON: ${{ steps.python.outcome }}
        WFS_PREFLIGHT: ${{ steps.preflight.outcome }}
        WFS_VALIDATION: ${{ steps.verify.outcome }}
        WFS_TAILNET: ${{ steps.tailnet.outcome }}
        WFS_REMOTE: ${{ steps.remote.outcome }}
      run: |
        if ($env:WFS_CHECKOUT -eq 'success' -and $env:WFS_PYTHON -eq 'success') {
          python -m windows.report access
        } else {
          @"
        # WFS Windows Workspace

        **Setup did not reach preflight.**

        | Stage | Result |
        | --- | --- |
        | Source checkout | $env:WFS_CHECKOUT |
        | Python toolchain | $env:WFS_PYTHON |
        "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
        }
    - name: '08 · Install applications'
      if: ${{ !inputs.validation_only && steps.remote.outcome == 'success' }}
      continue-on-error: true
      timeout-minutes: 44
      id: apps
      shell: pwsh
      run: |
        Write-Host '::group::WFS / Base desktop applications'
        try { ./windows/install-apps.ps1 -Group base } finally { Write-Host '::endgroup::' }
        $job = Start-Job -ArgumentList (Get-Location).Path -ScriptBlock { param($root) Set-Location $root; ./windows/install-apps.ps1 -Group cli }
        Write-Host '::group::WFS / Desktop and media applications'
        try {
          ./windows/install-apps.ps1 -Group gui
        } finally {
          Write-Host '::endgroup::'
          Write-Host '::group::WFS / Command-line tools and AI agents'
          try {
            $done = Wait-Job $job -Timeout 1200
            Receive-Job $job -ErrorAction Continue
            if (-not $done -or $job.State -ne 'Completed') {
              & python shared/workspace.py status 'Windows CLI worker' warning 'See installer step; remote access remains active'
            }
          } finally {
            Remove-Job -Job $job -Force
            Write-Host '::endgroup::'
          }
        }
    - name: '09 · Publish application results'
      if: ${{ !cancelled() && steps.remote.outcome == 'success' }}
      shell: pwsh
      continue-on-error: true
      env:
        WFS_APP_OUTCOME: ${{ steps.apps.outcome }}
      run: python -m windows.report apps
    - name: '10 · Keep verified endpoints available'
      if: ${{ !cancelled() && steps.remote.outcome == 'success' }}
      shell: pwsh
      run: python shared/workspace.py hold
    - name: '11 · Close listeners and clean up'
      if: ${{ always() && !inputs.validation_only && steps.preflight.outcome == 'success' }}
      shell: pwsh
      timeout-minutes: 3
      run: ./windows/remote.ps1 -Phase cleanup
